name: Deploy to gh-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - simulator
      - web
  schedule:
    - cron: "0 7 * * *"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to release
        id: decide
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Each release is tagged, so commits since the last tag are new.
          last="$(git describe --tags --abbrev=0)"
          count="$(git rev-list --count "$last..HEAD")"
          echo "$count commits since $last"
          if [ "$count" -gt 0 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm install

      - name: build & release
        run: |
          git config --global user.name "$USER_NAME"
          git config --global user.email "$USER_EMAIL"

          VERSION="$(node scripts/stamp.cjs)"

          npm version $VERSION --include-workspace-root --no-git-tag-version
          git commit --all --message "Release $VERSION"

          npm run build

          git tag "$VERSION" HEAD
          git push origin "$VERSION"
          git push origin
        env:
          USER_NAME: "github-actions"
          USER_EMAIL: "github-actions@noreply.github.com"
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/build